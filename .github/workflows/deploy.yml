# Builds the Astro site and publishes it on GitHub Pages on every push to main (including saves from the admin page),
# and the same build on Cloudflare Pages (craigryy.pages.dev) as a second address for when GitHub Pages can't be reached.
# Pages source must be "GitHub Actions" (Settings → Pages), which is already set for this repo.
name: Deploy to GitHub Pages and Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Reads the site's address from the Pages settings: https://craigryy.github.io now, your domain once you add one.
      - id: pages
        uses: actions/configure-pages@v6
      - uses: withastro/action@v6
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # Repo Settings → Secrets and variables → Actions → Variables → WEB3FORMS_KEY (optional; see README).
          PUBLIC_WEB3FORMS_KEY: ${{ vars.WEB3FORMS_KEY }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # The same build, on Cloudflare Pages. Needs two repo secrets (Settings → Secrets and variables → Actions):
  # CLOUDFLARE_API_TOKEN (a token with "Cloudflare Pages: Edit") and CLOUDFLARE_ACCOUNT_ID. Skipped until both exist.
  cloudflare:
    needs: build
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Get the build
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        uses: actions/download-artifact@v4
        with:
          name: github-pages
      - name: Unpack it
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: mkdir dist && tar -xf artifact.tar -C dist
      # First run only: makes the project. Fails harmlessly once it exists.
      - name: Create the Cloudflare Pages project
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create craigryy --production-branch=main
      - name: Deploy to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=craigryy --branch=main
      - name: Waiting for Cloudflare secrets
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: echo "::notice::Cloudflare Pages skipped. Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repo secrets to turn it on."
